<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEXORA — Web Video Downloader & Media Player</title>
    <meta name="description" content="VEXORA is a secure, responsive web video downloader and in-app media player supporting direct video streams, HLS playlists, and audio extraction." />
    <meta property="og:title" content="VEXORA — Web Video Downloader & Media Player" />
    <meta property="og:description" content="VEXORA is a secure, responsive web video downloader and in-app media player supporting direct video streams, HLS playlists, and audio extraction." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#060A14" />
    <script>
      try {
        var raw = localStorage.getItem('vexora_settings_v1');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.theme === 'light') {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F4F7FB');
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4F7FB] text-slate-900 dark:bg-[#060A14] dark:text-slate-100 antialiased selection:bg-blue-600/25 selection:text-blue-700 dark:selection:bg-blue-600/30 dark:selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
